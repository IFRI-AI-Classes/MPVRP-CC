<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scoreboard — MPVRP-CC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter'],display:['Bricolage Grotesque']}}}}</script>
  <link rel="stylesheet" href="static/css/app.css?v=20260815-orange">
</head>
<body class="bg-[#eee9e1] text-stone-900">
  <header aria-label="Site navigation"></header>
  <main class="mx-auto max-w-6xl px-5 py-14 lg:px-8">
    <div class="flex flex-col justify-between gap-6 sm:flex-row sm:items-end">
      <div>
        <p class="text-xs font-bold uppercase tracking-[.18em] text-[#F4320B]">Official benchmark</p>
        <p class="mt-4 text-stone-600">Current recorded submission per participant. Lower scores are better.</p>
        <p id="lb-count" class="mt-2 text-sm font-semibold text-[#F4320B]"></p>
      </div>
      <button id="refresh-btn" onclick="loadLeaderboard()" class="rounded-full border border-stone-300 bg-[#fffaf5] px-5 py-3 text-sm font-semibold hover:border-[#F4320B]">↻ Refresh</button>
    </div>
    <div class="mt-10 overflow-hidden rounded-2xl border border-stone-200 bg-[#fffaf5] shadow-sm">
      <div id="lb-state" class="p-10 text-center text-stone-500">Loading scoreboard…</div>
      <div class="overflow-x-auto">
        <table id="leaderboard-table" class="w-full text-left text-sm" style="display:none">
          <thead class="border-b border-stone-200 bg-stone-100 text-xs uppercase tracking-wider text-stone-500"><tr><th class="px-6 py-4">Rank</th><th class="px-6 py-4">Participant</th><th class="px-6 py-4">Total score</th><th class="px-6 py-4">Valid</th><th class="px-6 py-4">Last submission</th></tr></thead>
          <tbody id="leaderboard-body" class="divide-y divide-stone-100"></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer data-site-footer class="border-t border-stone-300 bg-[#e5ded4]"></footer>
  <script src="static/js/config.js"></script>
  <script src="static/js/site.js?v=20260815-orange-2"></script>
  <script src="static/js/scoreboard.js"></script>
</body>
</html>
